baseURL: 'https://chyok.github.io/'
title: chyok
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

# GitHub star counts are fetched at build time; re-fetch at most every 6 hours locally.
caches:
  getresource:
    dir: :cacheDir/:project
    maxAge: 6h

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "Sharing programming knowledge and some personal works, documents."
  keywords: [Blog, Portfolio]
  author: chyok
  # Fallback preview image for link sharing (Open Graph / Twitter cards)
  images: ["favicon.png"]
  email: chyok@hotmail.com
  githubUser: chyok
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  displayFullLangName: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    favicon: "/favicon.png"
    favicon16x16: "/favicon.png"
    favicon32x32: "/favicon.png"
    apple_touch_icon: "/favicon.png"
    safari_pinned_tab: "/favicon.png"

  socialIcons:
    - name: github
      url: "https://github.com/chyok"

languages:
  en:
    label: "English"
    weight: 1
    params:
      title: chyok
      label:
        text: "chyok"
        icon: /favicon.png
        iconHeight: 35
      homeInfoParams:
        Title: "[~]$ whoami"
        Content: "A dedicated Developer with years of **industry experience**, deeply passionate about **coding** and building scalable systems. I also **enjoy contributing** to the **Open Source** community, believing in the power of sharing knowledge and collaborating to drive innovation."
    menu:
      main:
        - identifier: projects
          name: Projects
          url: /projects/
          weight: 10
        - identifier: archive
          name: Archive
          url: /archive/
          weight: 15
        - identifier: about
          name: About
          url: /about/
          weight: 20
        - identifier: search
          name: Search
          url: /search/
          weight: 30

  zh:
    label: "中文"
    locale: "zh-CN"
    weight: 2
    params:
      title: chyok
      label:
        text: "chyok"
        icon: /favicon.png
        iconHeight: 35
      homeInfoParams:
        Title: "[~]$ whoami"
        Content: "一名热爱**编码**的开发者，拥有多年**行业经验**，致力于构建高效、可扩展的系统。我也**乐于**在 **Open Source** 社区分享和贡献，坚信分享知识和协作创新能推动技术不断前行。"
    menu:
      main:
        - identifier: projects
          name: 项目
          url: /zh/projects/
          weight: 10
        - identifier: archive
          name: 归档
          url: /zh/archive/
          weight: 15
        - identifier: about
          name: 关于
          url: /zh/about/
          weight: 20
        - identifier: search
          name: 搜索
          url: /zh/search/
          weight: 30
